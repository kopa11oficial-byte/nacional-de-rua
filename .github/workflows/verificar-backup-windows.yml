name: Validar backup no Windows PowerShell 5.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backup-imip.ps1"
      - "scripts/verificar-backup-imip.ps1"
      - "scripts/testar-restauro-imip.ps1"
      - ".github/workflows/verificar-backup-windows.yml"

permissions:
  contents: read

jobs:
  validar-script-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar ASCII e sintaxe no PowerShell 5.1 sem segredos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path "./scripts/backup-imip.ps1").Path
          Write-Host "Windows PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Este teste requer Windows PowerShell 5.1."
          }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
            throw "O script deve conter apenas ASCII para evitar erros de codificacao no Windows PowerShell 5.1."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Erros de sintaxe no script."
          }
          Write-Host "OK: sintaxe PowerShell 5.1 valida, sem executar backup."
      - name: Verificar compatibilidade do script de restauro local
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path "./scripts/testar-restauro-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
            throw "O script de restauro nao e ASCII."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Sintaxe invalida no teste de restauro."
          }
          Write-Host "OK: sintaxe do teste de restauro validada em PowerShell 5.1."
      - name: Validar sintaxe do verificador e simular integridade de ficheiros
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path "./scripts/verificar-backup-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) { throw 'O verificador deve ser ASCII.' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Falha de sintaxe no verificador." }
          $pasta = Join-Path $env:RUNNER_TEMP 'imip-fixture'
          New-Item -Path $pasta -ItemType Directory -Force | Out-Null
          $dados = @()
          foreach ($nome in @('roles.sql','schema.sql','data.sql')) {
            $path = Join-Path $pasta $nome
            Set-Content -LiteralPath $path -Value ('-- DADOS FICTICIOS DE TESTE ' + $nome) -Encoding ASCII
            $dados += @{
              nome = $nome
              bytes = (Get-Item -LiteralPath $path).Length
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            }
          }
          @{
            referencia_supabase = 'fprwitwlvntnlnfqttrl'
            ficheiros = $dados
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $pasta 'manifesto.json') -Encoding UTF8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Pasta $pasta
          if ($LASTEXITCODE -ne 0) { throw 'Teste de integridade deveria passar.' }
          Add-Content -LiteralPath (Join-Path $pasta 'data.sql') -Value '-- ALTERADO' -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Pasta $pasta
          if ($LASTEXITCODE -ne 1) { throw 'O verificador nao detetou o ficheiro alterado.' }
          # O erro 1 e esperado neste teste negativo; limpar o codigo para o runner.
          $global:LASTEXITCODE = 0
          Write-Host 'OK: backup valido aceite e ficheiro modificado recusado.'
