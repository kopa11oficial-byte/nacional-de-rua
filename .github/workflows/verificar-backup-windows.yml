name: Validar backup no Windows PowerShell 5.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/backup-imip.ps1"
      - "scripts/verificar-backup-imip.ps1"
      - "scripts/testar-restauro-imip.ps1"
      - "scripts/preparar-dados-publicos-imip.ps1"
      - "scripts/backup-storage-imip.ps1"
      - "scripts/backup-auth-imip.ps1"
      - "scripts/validar-ligacao-imip.ps1"
      - ".github/workflows/verificar-backup-windows.yml"

permissions:
  contents: read

jobs:
  validar-script-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar ASCII e sintaxe no PowerShell 5.1 sem segredos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path "./scripts/backup-imip.ps1").Path
          Write-Host "Windows PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Este teste requer Windows PowerShell 5.1."
          }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
            throw "O script deve conter apenas ASCII para evitar erros de codificacao no Windows PowerShell 5.1."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Erros de sintaxe no script."
          }
          Write-Host "OK: sintaxe PowerShell 5.1 valida, sem executar backup."
      - name: Verificar compatibilidade do script de restauro local
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = (Resolve-Path "./scripts/testar-restauro-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
            throw "O script de restauro nao e ASCII."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Sintaxe invalida no teste de restauro."
          }
          Write-Host "OK: sintaxe do teste de restauro validada em PowerShell 5.1."
      - name: Testar selecao de public SQL sem dados internos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path "./scripts/preparar-dados-publicos-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) { throw "O filtro nao e ASCII." }
          $tokens = $null
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros.Count -ne 0) { throw "Erro de sintaxe no preparador SQL." }
          $dir = Join-Path $env:RUNNER_TEMP 'imip-sql-fixture'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $entrada = Join-Path $dir 'data.sql'
          $saida = Join-Path $dir 'data-publico.sql'
          @(
            '-- pg_dump ficticio'
            'SET statement_timeout = 0;'
            'RESET ALL;'
            'ALTER TABLE storage.buckets_vectors ENABLE TRIGGER ALL;'
            'COPY public.rodas (id, nome) FROM stdin;'
            ('r1' + [char]9 + 'Roda teste')
            '\.'
            'COPY public.mcs (id, nome) FROM stdin;'
            ('m1' + [char]9 + 'MC teste')
            '\.'
            'COPY storage.buckets_vectors (id) FROM stdin;'
            'segredo-interno-de-teste'
            '\.'
            'COPY auth.users (id) FROM stdin;'
            'user-interno-de-teste'
            '\.'
            'COPY public.edicoes (id) FROM stdin;'
            'e1'
            '\.'
            'COPY public.pontuacoes (id) FROM stdin;'
            'p1'
            '\.'
            "SELECT pg_catalog.setval('public.roda_seq', 42, true);"
            "SELECT pg_catalog.setval('storage.bucket_seq', 2, true);"
          ) | Set-Content -LiteralPath $entrada -Encoding UTF8
          $hashAntes = (Get-FileHash -LiteralPath $entrada -Algorithm SHA256).Hash
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Origem $entrada -Destino $saida
          if ($LASTEXITCODE -ne 0) { throw "Nao preparou os dados public." }
          $resultado = Get-Content -LiteralPath $saida -Raw -Encoding UTF8
          if ($resultado -notmatch 'COPY public\.mcs' -or
              $resultado -notmatch 'COPY public\.rodas' -or
              $resultado -notmatch "setval\('public.roda_seq'") {
            throw "O preparador perdeu dados public."
          }
          if ($resultado -match 'RESET ALL' -or $resultado -match 'ALTER TABLE') {
            throw "Comando nao permitido incluido no SQL temporario."
          }
          $resumo = Get-Content -LiteralPath ($saida + '.contagens.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($resumo.rodas -ne 1 -or $resumo.mcs -ne 1 -or $resumo.edicoes -ne 1 -or $resumo.pontuacoes -ne 1) {
            throw "As contagens dos dados originais nao foram preservadas."
          }
          if ($resultado -match 'storage\.' -or $resultado -match 'auth\.') {
            throw "O preparador deixou entrar dados internos."
          }
          if ($resultado -match 'segredo-interno-de-teste' -or $resultado -match 'user-interno-de-teste') {
            throw "O preparador deixou entrar linhas de tabelas internas."
          }
          if ((Get-FileHash -LiteralPath $entrada -Algorithm SHA256).Hash -ne $hashAntes) {
            throw "A exportacao original foi alterada."
          }
          Add-Content -LiteralPath $entrada -Value 'DELETE FROM public.mcs;' -Encoding UTF8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Origem $entrada -Destino $saida
          if ($LASTEXITCODE -ne 1) { throw "O preparador nao bloqueou SQL desconhecido." }
          $global:LASTEXITCODE = 0
          Write-Host "OK: apenas public restauravel, dados internos excluidos e comandos inesperados bloqueados."
      - name: Testar leitura do Storage sem download nem segredos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path "./scripts/backup-storage-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) { throw "Script Storage precisa ser ASCII." }
          $tokens = $null
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$erros) | Out-Null
          if ($erros.Count -ne 0) { $erros | ForEach-Object { Write-Host $_.Message }; throw "Erro de sintaxe Storage." }
          $dir = Join-Path $env:RUNNER_TEMP 'imip-storage-fixture'
          New-Item -Path $dir -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $dir 'roles.sql') -Value '-- roles ficticios do teste' -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $dir 'schema.sql') -Value '-- esquema ficticio do teste' -Encoding ASCII
          $source = Join-Path $dir 'data.sql'
          $rows = @(
            '-- pg_dump ficticio para teste offline'
            'COPY storage.objects (id, bucket_id, name, owner) FROM stdin;'
            ('a' + [char]9 + 'fotos-mcs' + [char]9 + 'MC/foto1.jpg' + [char]9 + '\N')
            ('b' + [char]9 + 'imagens-rodas' + [char]9 + 'rodas/foto2.png' + [char]9 + '\N')
            '\.'
            'COPY public.rodas (id) FROM stdin;'
            'roda1'
            '\.'
          )
          $rows | Set-Content -LiteralPath $source -Encoding UTF8
          $meta = @()
          foreach ($name in @('roles.sql','schema.sql','data.sql')) {
            $p = Join-Path $dir $name
            $meta += @{
              nome = $name
              bytes = (Get-Item -LiteralPath $p).Length
              sha256 = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
            }
          }
          @{ referencia_supabase='fprwitwlvntnlnfqttrl'; ficheiros=$meta } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $dir 'manifesto.json') -Encoding UTF8
          $saida = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Pasta $dir -ApenasVerificarLista
          if ($LASTEXITCODE -ne 0) { $saida | Write-Host; throw "Nao reconheceu dois objetos Storage." }
          if (($saida -join [char]10) -notmatch 'Total: 2') { throw "Totais Storage incorretos." }
          if (($saida -join [char]10) -notmatch 'PRE-VISUALIZACAO CONCLUIDA') { throw "Teste nao foi offline." }
          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          if (-not $hash) { throw "Nao verificou data.sql original." }
          Write-Host "OK: dois objetos listados, sem downloads ou credenciais."
      - name: Validar URIs PostgreSQL ficticias sem contactar Supabase
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $f = (Resolve-Path "./scripts/validar-ligacao-imip.ps1").Path
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "Erro de sintaxe no validador de URI." }
          . $f
          $refImip = 'fprwitwlvntnlnfqttrl'
          $pooler = 'aws-1-eu-west-1.pooler.supabase.com'
          $uriNormal = 'postgresql://postgres.' + $refImip + ':senhaFicticia123@' + $pooler + ':5432/postgres'
          $r1 = ConvertTo-ImipPgUri -Ligacao $uriNormal
          if ($r1 -ne $uriNormal) { throw 'URI Session pooler deveria passar sem alteracoes.' }

          $uriComCaracteres = 'postgresql://postgres.' + $refImip + ':senha@com#simbolo?@' + $pooler + ':5432/postgres'
          $r2 = ConvertTo-ImipPgUri -Ligacao $uriComCaracteres
          if ($r2 -notmatch 'senha%40com%23simbolo%3F') { throw 'A password nao foi percent-encoded.' }

          $uriCodificada = 'postgresql://postgres.' + $refImip + ':senha%40segura@' + $pooler + ':5432/postgres'
          $r3 = ConvertTo-ImipPgUri -Ligacao $uriCodificada
          if ($r3 -ne $uriCodificada) { throw 'A password ja codificada foi alterada.' }

          $direct = 'postgresql://postgres:senhaFicticia@db.' + $refImip + '.supabase.co:5432/postgres'
          $r4 = ConvertTo-ImipPgUri -Ligacao $direct
          if ($r4 -ne $direct) { throw 'Direct .supabase.co deveria ser aceite.' }

          $errados = @(
            'postgresql://postgres.OUTRO:senhaFicticia@' + $pooler + ':5432/postgres',
            'postgresql://postgres.' + $refImip + ':[YOUR-PASSWORD]@' + $pooler + ':5432/postgres',
            'postgresql://postgres.' + $refImip + ':senhaFicticia@evil.example.com:5432/postgres'
          )
          foreach ($uri in $errados) {
            $rejeitada = $false
            try { $null = ConvertTo-ImipPgUri -Ligacao $uri } catch { $rejeitada = $true }
            if (-not $rejeitada) { throw 'Um URI inseguro nao foi rejeitado.' }
          }
          Write-Host 'OK: Session pooler, Direct, caracteres especiais e rejeicao de URIs erradas.'
      - name: Verificar sintaxe PowerShell do backup Auth cifrado (sem o executar)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path "./scripts/backup-auth-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) {
            throw "O script Auth precisa ser ASCII."
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Sintaxe invalida no backup Auth."
          }
          $conteudo = [System.IO.File]::ReadAllText($script)
          if (-not $conteudo.Contains('--schema auth') -or
              -not $conteudo.Contains('--data-only') -or
              -not $conteudo.Contains('--use-copy') -or
              -not $conteudo.Contains('Read-Host "Cola a ligacao PostgreSQL no campo protegido" -AsSecureString')) {
            throw "Estao em falta protecoes essenciais no backup Auth."
          }
          Write-Host "OK: sintaxe e controlos principais do backup Auth."
      - name: Validar sintaxe do verificador e simular integridade de ficheiros
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = (Resolve-Path "./scripts/verificar-backup-imip.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($script)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -ne 0) { throw 'O verificador deve ser ASCII.' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Falha de sintaxe no verificador." }
          $pasta = Join-Path $env:RUNNER_TEMP 'imip-fixture'
          New-Item -Path $pasta -ItemType Directory -Force | Out-Null
          $dados = @()
          foreach ($nome in @('roles.sql','schema.sql','data.sql')) {
            $path = Join-Path $pasta $nome
            Set-Content -LiteralPath $path -Value ('-- DADOS FICTICIOS DE TESTE ' + $nome) -Encoding ASCII
            $dados += @{
              nome = $nome
              bytes = (Get-Item -LiteralPath $path).Length
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            }
          }
          @{
            referencia_supabase = 'fprwitwlvntnlnfqttrl'
            ficheiros = $dados
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $pasta 'manifesto.json') -Encoding UTF8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Pasta $pasta
          if ($LASTEXITCODE -ne 0) { throw 'Teste de integridade deveria passar.' }
          Add-Content -LiteralPath (Join-Path $pasta 'data.sql') -Value '-- ALTERADO' -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Pasta $pasta
          if ($LASTEXITCODE -ne 1) { throw 'O verificador nao detetou o ficheiro alterado.' }
          # O erro 1 e esperado neste teste negativo; limpar o codigo para o runner.
          $global:LASTEXITCODE = 0
          Write-Host 'OK: backup valido aceite e ficheiro modificado recusado.'
