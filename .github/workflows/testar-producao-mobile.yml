name: Verificar site publicado e mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/testar-producao-mobile.yml"
      - "scripts/testar-producao-mobile.mjs"
      - "app/**"
      - "lib/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"

permissions:
  contents: read

jobs:
  publicacao-mobile:
    name: Cloudflare e ecrãs móveis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright isoladamente sem alterar dependências do IMIP
        run: |
          mkdir -p .teste-navegador
          npm install --prefix .teste-navegador --no-save --no-package-lock playwright@1.56.1
      - name: Preparar navegador Chromium
        run: ./.teste-navegador/node_modules/.bin/playwright install --with-deps chromium
      - name: Verificar rotas públicas na Cloudflare em Android e iPhone
        run: node scripts/testar-producao-mobile.mjs
      - name: Guardar capturas do site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imip-mobile-cloudflare
          path: artefactos-producao/*.png
          if-no-files-found: ignore
